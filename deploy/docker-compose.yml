services:
  lookcam:
    build:
      # Context is the repository root; external lookcam is not needed.
      context: ..
      dockerfile: deploy/Dockerfile
    image: lookcam-service:latest
    # Host network only: LanSearch is a UDP broadcast into the camera subnet; from
    # bridge it goes to the wrong place, and port 32108 cannot be published.
    network_mode: host
    restart: unless-stopped
    volumes:
      # Paths are relative to this compose file (deploy/).
      - ../config:/app/config
      - ../lookcam_data:/app/lookcam_data
    environment:
      - TZ=Europe/Moscow
    # HTTP bind comes from config (0.0.0.0 by default). RTSP stays on loopback
    # until config sets rtsp.bind and an RTSP password.
